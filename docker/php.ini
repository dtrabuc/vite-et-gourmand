; Réglages PHP du conteneur
; E en premier : les variables du docker-compose arrivent dans $_ENV
variables_order = "EGPCS"
date.timezone = Europe/Paris
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
upload_max_filesize = 5M
post_max_size = 8M
memory_limit = 256M
session.use_strict_mode = 1
