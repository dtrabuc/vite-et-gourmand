name: PHP checks

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Vérifier la syntaxe PHP
        shell: bash
        run: |
          set -e
          for file in $(find App config public -type f -name "*.php"); do
            php -l "$file" >/dev/null
          done

      - name: Vérifier Composer
        shell: bash
        run: composer validate --no-check-publish
