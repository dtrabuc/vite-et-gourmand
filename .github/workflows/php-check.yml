name: PHP checks

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Vérifier la syntaxe PHP
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              failures=$((failures + 1))
            fi
          done < <(find App config public -type f -name "*.php" -print0)

          if [ "$failures" -gt 0 ]; then
            echo "Le contrôle de syntaxe a détecté $failures fichier(s) PHP en erreur."
            exit 1
          fi
