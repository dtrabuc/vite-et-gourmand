name: PHP checks

on:
  push:
    branches: ["alpha"]
  pull_request:
    branches: ["alpha"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Check PHP syntax
        shell: bash
        run: |
          set -e
          find App config public -type f -name "*.php" -print0 | xargs -0 -n1 php -l
