name: PHP checks

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Vérifier la syntaxe PHP
        shell: bash
        run: |
          set +e
          status=0
          : > syntax.log
          while IFS= read -r -d '' file; do
            echo "===== $file =====" | tee -a syntax.log
            php -l "$file" 2>&1 | tee -a syntax.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then status=1; fi
          done < <(find App config public -type f -name "*.php" -print0)
          exit "$status"

      - name: Conserver le rapport de syntaxe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-syntaxe-php
          path: syntax.log

