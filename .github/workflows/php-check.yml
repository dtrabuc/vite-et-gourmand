name: PHP checks

on:
  push:
    branches: ["alpha"]
  pull_request:
    branches: ["alpha"]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Check PHP syntax
        shell: bash
        run: |
          set +e
          : > syntax.log
          find App config public -type f -name "*.php" -print0 | while IFS= read -r -d '' file; do
            php -l "$file" >> syntax.log 2>&1
          done
          cat syntax.log
          if grep -qE 'Parse error|Fatal error|Errors parsing' syntax.log; then exit 1; fi
      - name: Upload syntax report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-syntax-report
          path: syntax.log
          if-no-files-found: error
