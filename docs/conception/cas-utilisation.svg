" font-size="12.5" font-weight="700" fill="#2c3e50">Client</text><g stroke="#2c3e50" stroke-width="2" fill="none"><circle cx="1640" cy="410" r="10" fill="#fff"/><line x1="1640" y1="420" x2="1640" y2="445"/><line x1="1624" y1="430" x2="1656" y2="430"/><line x1="1640" y1="445" x2="1626" y2="468"/><line x1="1640" y1="445" x2="1654" y2="468"/></g><text x="1640" y="486" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c3e50">Employé</text><g stroke="#2c3e50" stroke-width="2" fill="none"><circle cx="1640" cy="870" r="10" fill="#fff"/><line x1="1640" y1="880" x2="1640" y2="905"/><line x1="1624" y1="890" x2="1656" y2="890"/><line x1="1640" y1="905" x2="1626" y2="928"/><line x1="1640" y1="905" x2="1654" y2="928"/></g><text x="1640" y="946" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c3e50">Administrateur</text><g stroke="#2c3e50" stroke-width="2" fill="none"><circle cx="140" cy="1010" r="10" fill="#fff"/><line x1="140" y1="1020" x2="140" y2="1045"/><line x1="124" y1="1030" x2="156" y2="1030"/><line x1="140" y1="1045" x2="126" y2="1068"/><line x1="140" y1="1045" x2="154" y2="1068"/></g><text x="140" y="1086" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c3e50">Cartographie OSM</text><g stroke="#2c3e50" stroke-width="2" fill="none"><circle cx="1640" cy="1120" r="10" fill="#fff"/><line x1="1640" y1="1130" x2="1640" y2="1155"/><line x1="1624" y1="1140" x2="1656" y2="1140"/><line x1="1640" y1="1155" x2="1626" y2="1178"/><line x1="1640" y1="1155" x2="1654" y2="1178"/></g><text x="1640" y="1196" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c3e50">Serveur e-mail</text><path d="M140.0 560.0 L140.0 266.0" fill="none" stroke="#2c3e50" stroke-width="1.3" marker-end="url(#tri)"/><path d="M1640.0 860.0 L1640.0 496.0" fill="none" stroke="#2c3e50" stroke-width="1.3" marker-end="url(#tri)"/><ellipse cx="520" cy="160" rx="150.0" ry="26.0" fill="#fff" stroke="#8b2635" stroke-width="1.4"/><text x="520" y="157.0" text-anchor